services:
  - type: web
    name: gda-ticket-board
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci
    startCommand: node server/index.js
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: gda-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: "true"
      # Set these two yourself in the Render dashboard before the first deploy.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false

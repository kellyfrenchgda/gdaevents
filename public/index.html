<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GDA Ticket Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
.admin-tab{
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  padding:12px 20px;background:transparent;color:var(--ink-2);border-bottom:2px solid transparent;
  transition:color .15s,border-color .15s;
}
.admin-tab:hover{color:var(--ink)}
.admin-tab.on{color:var(--ink);border-bottom:2px solid var(--amber-deep);font-weight:600}
.ref-row{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:3px;
  background:var(--paper-2);border:1px solid var(--rule-2);margin-bottom:5px;
}
.ref-row .rname{flex:1;font-size:14px;font-weight:600}
.ref-row .rmeta{font-size:12.5px;color:var(--ink-2);margin-left:4px}
.swatch{width:14px;height:14px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.1)}
.role-badges{display:flex;gap:4px;flex-wrap:wrap}
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-in">
    <div class="wordmark">
      <div class="eyebrow">Good Drinks Australia · Sponsorship &amp; Events</div>
      <h1>The Ticket Board</h1>
    </div>
    <div class="tally">
      <div class="tally-item"><div class="n" id="tEvents">—</div><div class="l">Upcoming</div></div>
      <div class="tally-item"><div class="n hot" id="tLeft">—</div><div class="l">Seats left</div></div>
      <div class="tally-item"><div class="n" id="tAlloc">—</div><div class="l">Allocated</div></div>
    </div>
    <div class="whoami">
      <b id="meName">…</b><span class="role" id="meRole"></span>
      <button class="linkish" id="btnPassword">Password</button>
      <button class="linkish" id="btnAdmin" hidden>Admin</button>
      <button class="linkish" id="btnLogout">Sign out</button>
    </div>
  </div>
</header>

<div class="controls">
  <div class="controls-in">
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.7"/><path d="M11 11l4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Search team, venue, brand or guest" aria-label="Search events">
    </div>
    <select class="filter" id="fState" aria-label="Filter by state"></select>
    <select class="filter" id="fSport" aria-label="Filter by sport"></select>
    <select class="filter" id="fBrand" aria-label="Filter by brand"></select>
    <label class="toggle"><input type="checkbox" id="fPast"> Show past</label>
    <button class="btn ghost sm" id="btnExport">Export CSV</button>
    <button class="btn" id="btnAdd" hidden>Add event</button>
  </div>
</div>

<main id="board" aria-live="polite"></main>

<div class="scrim" id="scrim"></div>

<!-- event detail sheet -->
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-head" id="sheetHead">
    <div class="row1">
      <div>
        <div class="when" id="sheetWhen"></div>
        <h2 id="sheetTitle"></h2>
      </div>
      <button class="x" id="btnCloseSheet" aria-label="Close event">✕</button>
    </div>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
  <div class="sheet-foot" id="sheetFoot"></div>
</aside>

<!-- event form -->
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-scrim" id="modalScrim"></div>
  <div class="modal-card">
    <div class="modal-head"><h2 id="modalTitle">Add event</h2></div>
    <div class="modal-body">
      <label class="f"><span>Event type</span><select class="f" id="mEventType"></select></label>
      <label class="f"><span id="lblName">Fixture or event name</span><input class="f" id="mName" placeholder="e.g. Round 22 — Crows v Dockers"></label>
      <div class="grid2">
        <label class="f"><span>Date</span><input class="f" id="mDate" type="date"></label>
        <label class="f"><span>Start time</span><input class="f" id="mTime" type="time"></label>
      </div>
      <div class="grid2 sponsonly">
        <label class="f"><span>Sport</span><select class="f" id="mSport"></select></label>
        <label class="f"><span>Team</span><select class="f" id="mTeam"></select></label>
      </div>
      <label class="f sponsonly"><span>Opponent</span><input class="f" id="mOpp" placeholder="e.g. Fremantle Dockers"></label>
      <div class="grid2">
        <label class="f"><span>State</span><select class="f" id="mState"></select></label>
        <label class="f"><span>Venue</span><input class="f" id="mVenue" placeholder="e.g. Adelaide Oval"></label>
      </div>
      <div class="grid2">
        <label class="f"><span>Major brand</span><select class="f" id="mBrand"></select></label>
        <label class="f"><span>Total seats / tickets</span><input class="f" id="mCap" type="number" min="0" step="1" placeholder="24"></label>
      </div>
      <label class="f"><span>Notes</span><textarea class="f" id="mNotes" placeholder="Suite location, dress code, arrival time, host on the night…"></textarea></label>
      <div class="warn" id="mWarn" role="alert"></div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" id="btnCancel">Cancel</button>
      <button class="btn amber" id="btnSave">Save event</button>
    </div>
  </div>
</div>

<!-- admin panel -->
<div class="modal" id="adminPanel" role="dialog" aria-modal="true" aria-labelledby="adminPanelTitle">
  <div class="modal-scrim" id="adminScrim"></div>
  <div class="modal-card" style="max-width:760px">
    <div class="modal-head" style="justify-content:space-between">
      <h2 id="adminPanelTitle">Admin</h2>
      <button class="x" id="btnAdminClose" aria-label="Close admin panel">✕</button>
    </div>
    <div style="display:flex;border-bottom:1px solid var(--rule);background:var(--paper-2)">
      <button class="admin-tab on" data-tab="staff">Staff access</button>
      <button class="admin-tab" data-tab="teams">Sporting teams</button>
      <button class="admin-tab" data-tab="brands">Brands</button>
      <button class="admin-tab" data-tab="event-types">Event Types</button>
    </div>
    <div class="modal-body" id="adminBody" style="min-height:380px"></div>
    <div class="modal-foot" style="justify-content:space-between">
      <button class="btn danger sm" id="btnReseed" title="Wipe all events and reload the sample data">Reload demo data</button>
      <button class="btn ghost" id="btnAdminClose2">Close</button>
    </div>
  </div>
</div>

<!-- password -->
<div class="modal" id="pwd" role="dialog" aria-modal="true" aria-labelledby="pwdTitle">
  <div class="modal-scrim" id="pwdScrim"></div>
  <div class="modal-card" style="max-width:440px">
    <div class="modal-head"><h2 id="pwdTitle">Change password</h2></div>
    <div class="modal-body">
      <label class="f"><span>Current password</span><input class="f" id="pCurrent" type="password" autocomplete="current-password"></label>
      <label class="f"><span>New password</span><input class="f" id="pNext" type="password" autocomplete="new-password" placeholder="10+ characters"></label>
      <div class="warn" id="pWarn" role="alert"></div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" id="btnPwdCancel">Cancel</button>
      <button class="btn amber" id="btnPwdSave">Change password</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>
<script src="/js/app.js"></script>
</body>
</html>
